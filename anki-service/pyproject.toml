[project]
name = "anki-service"
version = "0.1.0"
description = "FastAPI service for the Anki Telegram bot"
readme = "README.md"
authors = [
    { name = "Fasimay", email = "x0x0x0x06@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "anki==26.8.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
anki-service = "anki_service.main:run"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
