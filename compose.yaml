services:
  anki-service:
    build:
      context: ./anki-service
    environment:
      ANKI_HOST: 0.0.0.0
      ANKI_PORT: 8000
      ANKI_RELOAD: "false"
      ANKI_LOG_LEVEL: ${ANKI_LOG_LEVEL:-info}
    ports:
      - "${ANKI_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
